<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Más vendidos - BA Style</title>
    <meta name="description" content="Productos más vendidos de BA Style. Elegidos por la comunidad. Zona La Plata.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://stylesba.netlify.app/mas-vendidos.html">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="assets/css/styles.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/imagenes/BAStyle.png">
    <link rel="shortcut icon" type="image/png" href="assets/imagenes/BAStyle.png">
    <link rel="apple-touch-icon" href="assets/imagenes/BAStyle.png">
  </head>
  <body class="bg-light">
    <header class="shadow-sm bg-ml-yellow">
      <nav class="navbar navbar-expand-lg navbar-dark container-lg py-3">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
          <img class="logo-badge" src="assets/imagenes/BAStyle.png" width="40" height="40" alt="BA Style">
          <span>BA Style</span>
        </a>
      </nav>
    </header>

    <main class="container-lg py-4">
      <h1 class="h4 mb-3">Más vendidos</h1>
      <p class="text-muted">Nuestros productos más elegidos por la comunidad.</p>
      <div id="productsGrid" class="row g-3 row-cols-2 row-cols-md-3 row-cols-lg-4"></div>
    </main>

    <!-- Reutilizamos modal y carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCart" aria-labelledby="offcanvasCartLabel">
      <div class="offcanvas-header">
        <h5 id="offcanvasCartLabel" class="mb-0">Tu carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div id="cartItems" class="vstack gap-2 mb-3"></div>
        <div class="mt-auto border-top pt-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-semibold">Total</span>
            <span class="fw-bold">$<span id="cartTotal">0</span></span>
          </div>
          <button class="btn btn-success w-100" id="checkoutBtn">Finalizar compra</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // mostrar todo y confiar en app.js para armar cards
        renderGrid(PRODUCTS);
      });
    </script>
  </body>
  </html>
