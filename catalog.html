<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BA Style - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <script>window.CATALOG_FILTER_MODE = true;</script>
    <header class="shadow-sm bg-ml-yellow">
      <nav class="navbar navbar-expand-lg navbar-dark container-lg py-3">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
          <img class="logo-badge" src="assets/imagenes/BAStyle.png" width="40" height="40" alt="BA Style">
          <span>BA Style</span>
        </a>
        <form class="d-none d-lg-flex flex-grow-1 mx-lg-4 my-2 my-lg-0" role="search" onsubmit="return false">
          <div class="input-group w-100">
            <input id="searchInput" class="form-control" type="search" placeholder="Ingresá lo que quieras encontrar" aria-label="Buscar">
            <button class="btn btn-outline-secondary bg-white" id="searchBtn" type="button">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
        <div class="ms-auto">
          <a class="btn btn-outline-dark position-relative" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCart">
            <i class="bi bi-cart3"></i>
            <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
          </a>
        </div>
      </nav>
    </header>

    <main class="container-lg py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 id="catalogTitle" class="h4 mb-0">Catálogo</h1>
        <div class="text-muted small" id="catalogHint">Seleccioná un producto para ver detalles</div>
      </div>
      <!-- Filtros y orden -->
      <div class="row g-2 align-items-end mb-3">
        <div class="col-6 col-md-3">
          <label class="form-label small">Categoría</label>
          <select id="filterCategory" class="form-select">
            <option value="">Todas</option>
            <option value="remeras">Remeras</option>
            <option value="shorts">Shorts</option>
            <option value="pantalones">Pantalones</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small">Talle</label>
          <select id="filterSize" class="form-select">
            <option value="">Todos</option>
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small">Ordenar por</label>
          <select id="sortBy" class="form-select">
            <option value="recent">Novedades</option>
            <option value="price_asc">Precio: menor a mayor</option>
            <option value="price_desc">Precio: mayor a menor</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small">Rango de precio</label>
          <div class="input-group">
            <input id="priceMin" type="number" class="form-control" placeholder="Min">
            <input id="priceMax" type="number" class="form-control" placeholder="Max">
          </div>
        </div>
      </div>
      <div id="productsGrid" class="row g-3 row-cols-2 row-cols-md-3 row-cols-lg-4"></div>
      <div class="d-flex justify-content-center my-3">
        <button id="loadMoreBtn" class="btn btn-outline-primary">Cargar más</button>
      </div>
    </main>

    <!-- Modal y Offcanvas reutilizados -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalLabel">Detalle del producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-4 align-items-start">
              <div class="col-12 col-lg-6">
                <img id="modalImage" src="" class="w-100 rounded-3 object-fit-cover" alt="Producto">
              </div>
              <div class="col-12 col-lg-6">
                <h2 id="modalTitle" class="h4"></h2>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <span class="badge bg-dark">Punto de encuentro</span>
                  <span class="small text-muted">La Plata y alrededores</span>
                </div>
                <p id="modalDescription" class="text-muted"></p>
                <div class="mb-3">
                  <label class="form-label">Talla</label>
                  <div id="modalSizes" class="d-flex gap-2 flex-wrap"></div>
                </div>
                <div class="mb-3 d-flex align-items-center gap-3">
                  <div>
                    <div class="small text-muted">Precio</div>
                    <div class="h4 mb-0">$<span id="modalPrice">0</span></div>
                  </div>
                  <div class="ms-auto d-flex align-items-center gap-2">
                    <button class="btn btn-outline-secondary" id="qtyMinus" type="button" aria-label="Restar">-</button>
                    <input id="qtyInput" class="form-control text-center" style="width:80px" type="number" min="1" value="1">
                    <button class="btn btn-outline-secondary" id="qtyPlus" type="button" aria-label="Sumar">+</button>
                  </div>
                </div>
                <div class="d-grid d-sm-flex gap-2">
                  <button id="addToCartBtn" class="btn btn-primary flex-grow-1"><i class="bi bi-cart-plus"></i> Agregar al carrito</button>
                  <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Seguir viendo</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCart" aria-labelledby="offcanvasCartLabel">
      <div class="offcanvas-header">
        <h5 id="offcanvasCartLabel" class="mb-0">Tu carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div id="cartItems" class="vstack gap-2 mb-3"></div>
        <div class="mt-auto border-top pt-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-semibold">Total</span>
            <span class="fw-bold">$<span id="cartTotal">0</span></span>
          </div>
          <button class="btn btn-success w-100" id="checkoutBtn">Finalizar compra</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/app.js"></script>
    <script>
      // Catálogo con filtros + paginación
      function startCatalog() {
        const params = new URLSearchParams(window.location.search);
        const cat = params.get('cat');
        const title = document.getElementById('catalogTitle');
        const mapTitle = { remeras: 'Remeras', shorts: 'Shorts', pantalones: 'Pantalones', ofertas: 'Ofertas', novedades: 'Novedades' };
        if (cat) title.textContent = `Catálogo: ${mapTitle[cat] || cat}`;

        let current = [];
        function applyAll() {
          // base
          if (cat === 'ofertas') current = PRODUCTS.filter(p => p.price <= 20000);
          else if (cat === 'novedades') current = [...PRODUCTS].reverse();
          else if (cat) current = PRODUCTS.filter(p => p.category === cat);
          else current = [...PRODUCTS];

          // category filter
          const fcat = document.getElementById('filterCategory').value;
          if (fcat) current = current.filter(p => p.category === fcat);
          // size filter
          const fsize = document.getElementById('filterSize').value;
          if (fsize) current = current.filter(p => p.sizes?.includes(fsize));
          // price range
          const min = Number(document.getElementById('priceMin').value || 0);
          const max = Number(document.getElementById('priceMax').value || Infinity);
          current = current.filter(p => p.price >= min && p.price <= max);
          // sort
          const sort = document.getElementById('sortBy').value;
          if (sort === 'price_asc') current.sort((a,b)=>a.price-b.price);
          if (sort === 'price_desc') current.sort((a,b)=>b.price-a.price);
          if (sort === 'recent') current = current.reverse();
          // pagination
          page = 1; renderPage();
        }

        let page = 1; const pageSize = 8;
        function renderPage() {
          const slice = current.slice(0, page * pageSize);
          renderGrid(slice);
          document.getElementById('loadMoreBtn').style.display = slice.length < current.length ? 'inline-block':'none';
        }

        ['filterCategory','filterSize','sortBy','priceMin','priceMax'].forEach(id=>{
          document.getElementById(id).addEventListener('change', applyAll);
          document.getElementById(id).addEventListener('keyup', applyAll);
        });
        document.getElementById('loadMoreBtn').addEventListener('click', ()=>{ page++; renderPage(); });

        applyAll();
        // Si se llega con ?cat=... nos aseguramos de filtrar por esa cat
        if (cat) {
          document.getElementById('filterCategory').value = (cat === 'ofertas' || cat === 'novedades') ? '' : cat;
          applyAll();
        }
      }

      if (window.PRODUCTS_READY) startCatalog();
      else window.addEventListener('productsReady', startCatalog);
    </script>
  </body>
  </html>
